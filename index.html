<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You - Sohail Shah</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #ff0033;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .title {
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 0 0 10px #ff0033, 0 0 20px #ff0033;
            margin-bottom: 10px;
            z-index: 2;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .name {
            position: absolute;
            bottom: 15%;
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 10px #ff0033, 0 0 20px #ff0033, 0 0 30px #ff0033;
            z-index: 2;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="title">I Love You!</div>
    
    <canvas id="heartCanvas"></canvas>

    <!-- Dil ke neeche aapka naam -->
    <div class="name">Sohail Shah</div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Heart mathematical formula
        function heartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x, y };
        }

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                const t = Math.random() * Math.PI * 2;
                const point = heartPoint(t);
                
                // Scale & Position
                const scale = Math.min(canvas.width, canvas.height) / 40;
                this.targetX = canvas.width / 2 + point.x * scale;
                this.targetY = canvas.height / 2 + point.y * scale - 30; // Slightly shifted up for name fit

                this.x = canvas.width / 2 + (Math.random() - 0.5) * 50;
                this.y = canvas.height / 2 + (Math.random() - 0.5) * 50;
                
                this.size = Math.random() * 2 + 1;
                this.speed = Math.random() * 0.05 + 0.02;
                this.alpha = Math.random() * 0.8 + 0.2;
            }

            update() {
                this.x += (this.targetX - this.x) * this.speed;
                this.y += (this.targetY - this.y) * this.speed;

                if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < 2) {
                    if (Math.random() < 0.02) {
                        this.reset();
                    }
                }
            }

            draw() {
                ctx.fillStyle = `rgba(255, 0, 51, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const particles = [];
        const particleCount = 1200;

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
